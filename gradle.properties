# JVM arguments for the Gradle daemon.
# Faster builds.
org.gradle.parallel=true
org.gradle.caching=true
# AndroidX is required.
android.useAndroidX=true
# Only keep the R class for the module that declares resources.
android.nonTransitiveRClass=true

# A1: R8 full mode for release builds — stricter optimizations + smaller APK.
# (Resorting/rewrite of default-interface members etc.; rules must be explicit.)
android.enableR8.fullMode=true
# Kotlin code style.
kotlin.code.style=official

# sandbox memory guards (R1b build)
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
kotlin.daemon.jvmargs=-Xmx1024m
org.gradle.workers.max=2

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
